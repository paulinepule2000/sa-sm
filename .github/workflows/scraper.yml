name: Scraper
on:
  schedule:
    - cron: '18 4,10,16,22 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the "already posted" tracker so jobs are NOT re-posted to Facebook every run
      - name: Restore tracker
        uses: actions/cache/restore@v4
        with:
          path: processed_jobs_saudi_arabia.csv
          key: tracker-${{ github.run_id }}
          restore-keys: tracker-

      - name: Run scraper
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_BASE_URL:        ${{ secrets.SITE_BASE_URL }}
          FB_MAX_POSTS_PER_RUN: "15"
        run: python sa.py

      - name: Save tracker
        if: always()
        uses: actions/cache/save@v4
        with:
          path: processed_jobs_saudi_arabia.csv
          key: tracker-${{ github.run_id }}

      - name: Upload Excel output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-output-${{ github.run_id }}
          path: |
            jobs_output__saudi_arabia.xlsx
            processed_jobs__saudi_arabia.csv
          retention-days: 7
